[workspace]
members = ["crates/core", "crates/ass"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
publish = false

[workspace.dependencies]
assfonts-core = { path = "crates/core" }
assfonts-ass = { path = "crates/ass" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = "debuginfo"

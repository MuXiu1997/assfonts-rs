name: native-cli
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check -p assfonts-cli --no-default-features --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --release --locked
      - name: Inspect macOS linkage
        if: runner.os == 'macOS'
        run: |
          otool -L target/release/assfonts-rs | tee linkage.txt
          if tail -n +2 linkage.txt | awk '{print $1}' | grep -v '^/usr/lib/'; then
            echo "Unexpected non-system dynamic library" >&2
            exit 1
          fi
      - name: Inspect Windows linkage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1
          if (-not $dumpbin) { throw "dumpbin not found" }
          $dependencies = & $dumpbin.FullName /DEPENDENTS target/release/assfonts-rs.exe
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed" }
          $dependencies | Set-Content linkage.txt
          if ($dependencies -match '(?i)harfbuzz|vcruntime\d|msvcp\d') { throw "Unexpected third-party runtime dependency" }
      - uses: actions/upload-artifact@v4
        with:
          name: assfonts-rs-${{ matrix.os }}
          path: |
            target/release/assfonts-rs
            target/release/assfonts-rs.exe
            linkage.txt
            THIRD_PARTY.md
            vendor/harfbuzz/COPYING

  linux-musl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read Linux toolchain pins
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          pins = json.loads(Path('scripts/linux-toolchain.json').read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              for key, value in pins.items():
                  print(f"LINUX_{key.upper().replace('-', '_')}={value}", file=f)
              print(f"BINARY=target/zigbuild/{pins['target']}/release/assfonts-rs", file=f)
          PY
      - name: Install pinned build tools
        run: |
          rustup toolchain install "$LINUX_RUST" --profile minimal --target "$LINUX_TARGET"
          python3 -m pip install "cargo-zigbuild==$LINUX_CARGO_ZIGBUILD" "ziglang==$LINUX_ZIGLANG"
      - name: Build Linux release through the shared entry point
        run: python3 scripts/build_linux.py
      - name: Install independent rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfreetype6-dev libharfbuzz-dev libfribidi-dev binutils
          python3 -m pip install -r tests/render/requirements.txt
      - name: Inspect and execute the release artifact
        run: python3 scripts/check_linux_artifact.py --binary "$BINARY" --output .validation/artifact
      - name: Prepare verified open fonts and independent libass
        run: |
          python3 tests/render/prepare_fonts.py --output .validation/ci-fonts
          sh tests/render/build_oracle.sh
      - name: Render full fonts versus release-generated subsets
        run: |
          python3 tests/render/verify.py \
            --binary "$BINARY" --oracle .validation/oracle/verify_libass \
            --fixture tests/fixtures/ci-fonts.ass --ttc-face-index 1 \
            --ttc .validation/ci-fonts/NotoSans.ttc \
            --otf .validation/ci-fonts/NotoSansSC-Regular.otf \
            --output .validation/ci-render
          python3 scripts/check_linux_artifact.py --binary "$BINARY" --output .validation/artifact
      - name: Package the verified binary without rebuilding
        run: |
          mkdir -p .validation/package/licenses
          cp "$BINARY" "$(dirname "$BINARY")/build-manifest.json" THIRD_PARTY.md .validation/package/
          cp vendor/harfbuzz/COPYING .validation/package/licenses/harfbuzz-COPYING
          cp "$(dirname "$BINARY")/runtime-licenses/"* .validation/package/licenses/
          tar -czf .validation/assfonts-rs-linux-musl.tar.gz -C .validation/package .
      - uses: actions/upload-artifact@v4
        with:
          name: assfonts-rs-linux-musl
          if-no-files-found: error
          path: .validation/assfonts-rs-linux-musl.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assfonts-rs-linux-musl-validation
          path: |
            .validation/artifact/
            .validation/ci-render/
            .validation/ci-fonts/font-hashes.json
            .validation/ci-fonts/*LICENSE
            .validation/oracle/*.log
            .validation/oracle/dependency-versions.txt

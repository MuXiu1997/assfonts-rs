name: native-cli
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check -p assfonts-cli --no-default-features --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --release --locked
      - name: Inspect macOS linkage
        if: runner.os == 'macOS'
        run: |
          otool -L target/release/assfonts-rs | tee linkage.txt
          if tail -n +2 linkage.txt | awk '{print $1}' | grep -v '^/usr/lib/'; then
            echo "Unexpected non-system dynamic library" >&2
            exit 1
          fi
      - name: Inspect Windows linkage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1
          if (-not $dumpbin) { throw "dumpbin not found" }
          $dependencies = & $dumpbin.FullName /DEPENDENTS target/release/assfonts-rs.exe
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed" }
          $dependencies | Set-Content linkage.txt
          if ($dependencies -match '(?i)harfbuzz|vcruntime\d|msvcp\d') { throw "Unexpected third-party runtime dependency" }
      - uses: actions/upload-artifact@v4
        with:
          name: assfonts-rs-${{ matrix.os }}
          path: |
            target/release/assfonts-rs
            target/release/assfonts-rs.exe
            linkage.txt
            THIRD_PARTY.md
            vendor/harfbuzz/COPYING

  linux-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Test and build with musl-native C++ toolchain
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e RUSTFLAGS='-C target-feature=+crt-static' rust:1.92-alpine \
            sh -ec '
              apk add --no-cache g++ git binutils
              git config --global --add safe.directory /work
              git config --global --add safe.directory /work/vendor/harfbuzz
              cargo test --workspace --locked --target x86_64-unknown-linux-musl
              cargo build --release --locked --target x86_64-unknown-linux-musl
              readelf -l target/x86_64-unknown-linux-musl/release/assfonts-rs > linkage-program.txt
              readelf -d target/x86_64-unknown-linux-musl/release/assfonts-rs > linkage-dynamic.txt
              if grep -q INTERP linkage-program.txt || grep -q NEEDED linkage-dynamic.txt; then
                echo "Binary is not fully static" >&2
                exit 1
              fi
            '
      - uses: actions/upload-artifact@v4
        with:
          name: assfonts-rs-linux-musl
          path: |
            target/x86_64-unknown-linux-musl/release/assfonts-rs
            linkage-program.txt
            linkage-dynamic.txt
            THIRD_PARTY.md
            vendor/harfbuzz/COPYING

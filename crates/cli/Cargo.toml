[package]
name = "assfonts-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "assfonts-rs"
path = "src/main.rs"

[features]
default = ["harfbuzz"]
harfbuzz = ["dep:assfonts-harfbuzz"]

[dependencies]
assfonts-core.workspace = true
assfonts-ass.workspace = true
assfonts-fonts.workspace = true
assfonts-harfbuzz = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
walkdir = "2"
tempfile = "3"
